# Tasks for the checks CI runs (.github/workflows/ci.yml); CI's formula job uses Homebrew.
[tools]
# The formula syntax check needs it; Homebrew brings its own Ruby in CI.
ruby = "3.4"

[tasks."ci:changed"]
description = "What CI checks for the files changed since origin/main, without Homebrew or a network: every formula parses as Ruby (style, the online audit and the install test stay in CI). The coordinator's Checked gate runs it (RFC 0120). `--plan` prints the steps without running them"
usage = 'flag "--plan" help="print the steps without running them"'
shell = "bash -e -o pipefail -c"
run = 'exec bash tools/ci-changed.sh ${usage_plan:+--plan}'
